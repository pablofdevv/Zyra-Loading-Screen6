<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Store - Editorial Split-Screen</title>
    
    <!-- Google Fonts: Montserrat (Futura Bold Italic style) & Inter (Body text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,300;0,400;0,600;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
    
    <!-- Hojas de Estilos Modulares (Prompt Maestro) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/theme.css">
</head>
<body>
    <!-- Video de Fondo (Opcional) -->
    <video id="bg-video" loop muted playsinline class="bg-video-el hidden"></video>

    <!-- ESTRUCTURA PRINCIPAL PANTALLA DIVIDIDA (SPLIT-SCREEN) -->
    <div class="split-screen-wrapper">
        
        <!-- PANEL IZQUIERDO: Branding & Carga Vertical (50% Width) -->
        <section class="left-split-panel">
            <!-- Canvas de Partículas Suaves (Fondo) -->
            <canvas id="particles-canvas"></canvas>
            
            <!-- Superposición Cinemática -->
            <div class="panel-vignette"></div>

            <div class="left-panel-content">
                <!-- Logotipo e Identidad -->
                <div class="editorial-brand-box">
                    <div id="logo-container" class="editorial-logo-wrapper">
                        <!-- Logo de texto o imagen -->
                    </div>
                    <h2 id="server-claim" class="editorial-server-claim">ZYRA CORP</h2>
                    <p id="server-description" class="editorial-server-desc">Premium resources for multiplayer worlds.</p>
                </div>
            </div>

            <!-- Tira de Carga Vertical (Límite Derecho del Panel) -->
            <div class="vertical-loader-strip">
                <div class="vertical-loader-fill" id="vertical-progress-bar"></div>
            </div>
        </section>

        <!-- PANEL DERECHO: Centro de Control e Información (50% Width) -->
        <section class="right-split-panel">
            <div class="right-panel-content">
                
                <!-- SECCIÓN 01: Enlaces de Comunidad (Superior) -->
                <div class="editorial-section sec-links" id="socials-panel">
                    <h3 class="section-title">Official Communities</h3>
                    <nav class="editorial-links-grid" id="social-links-grid">
                        <!-- Enlaces de red -->
                    </nav>
                </div>

                <!-- SECCIÓN 02: Reproductor de Música (Medio) -->
                <div class="editorial-section sec-music" id="music-card-wrapper">
                    <h3 class="section-title">Ambient Sound System</h3>
                    <div class="editorial-music-player">
                        <!-- Detalle de pista -->
                        <div class="player-track-meta">
                            <span class="music-active-indicator"></span>
                            <div class="track-scroller-box">
                                <span class="track-label" id="track-title">LOADING MUSIC...</span>
                            </div>
                        </div>

                        <!-- Controles -->
                        <div class="player-controls-row">
                            <button id="play-pause-btn" class="player-action-btn" aria-label="Play/Pause">
                                <svg id="play-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <svg id="pause-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                                </svg>
                            </button>
                            
                            <div class="player-volume-slider-group">
                                <button id="volume-mute-btn" class="player-vol-btn" aria-label="Mute">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="player-vol-svg">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                                    </svg>
                                </button>
                                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.15" class="player-vol-range">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 03: Novedades & Changelog (Inferior) -->
                <div class="editorial-section sec-info">
                    <h3 class="section-title">Latest Updates & Controls</h3>
                    <div class="changelog-scroll-wrapper" id="timeline-feed-wrapper">
                        <!-- Changelogs y atajos de teclado inyectados -->
                    </div>
                </div>

                <!-- ESTADO DE CARGA Y LOGS DE FASES (PIE DE PÁGINA) -->
                <div class="editorial-footer-status">
                    <div class="status-phase-box">
                        <span class="status-prefix">> STATUS:</span>
                        <span id="log-text" class="status-phase-text">Connecting to host...</span>
                    </div>
                    <span id="progress-val-text" class="status-pct-text">0%</span>
                </div>

            </div>
        </section>

    </div>

    <!-- Elemento Audio Oculto -->
    <audio id="bg-audio" loop preload="auto"></audio>

    <!-- Scripts Modulares -->
    <script src="js/config.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/music.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/news.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
